<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051419"/>
      <stop offset="50%" stop-color="#020b0e"/>
      <stop offset="100%" stop-color="#010507"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad3)"/>
  <circle cx="280" cy="220" r="220" fill="#06b6d4" opacity="0.14" filter="url(#glow3)"/>
  <circle cx="920" cy="480" r="240" fill="#10b981" opacity="0.12" filter="url(#glow3)"/>

  <!-- Left: Info -->
  <g transform="translate(80, 100)">
    <rect width="210" height="38" rx="19" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.5"/>
    <circle cx="22" cy="19" r="6" fill="#06b6d4"/>
    <text x="38" y="24" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">HEALTHCARE &amp; ERP</text>

    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="42" font-weight="900" letter-spacing="-1">Labmate 8001</text>
    <text x="0" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="19" font-weight="500">Laboratory ERP &amp; Clinical DICOM Webviewer</text>

    <g transform="translate(0, 175)">
      <rect width="150" height="75" rx="16" fill="#082026" stroke="#134e4a"/>
      <text x="20" y="36" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="24" font-weight="800">DICOM 3.0</text>
      <text x="20" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Medical Web Viewer</text>
    </g>

    <g transform="translate(170, 175)">
      <rect width="150" height="75" rx="16" fill="#082026" stroke="#134e4a"/>
      <text x="20" y="36" fill="#34d399" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Automated</text>
      <text x="20" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Lab Specimen Track</text>
    </g>

    <g transform="translate(340, 175)">
      <rect width="150" height="75" rx="16" fill="#082026" stroke="#134e4a"/>
      <text x="20" y="36" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="24" font-weight="800">C# / .NET</text>
      <text x="20" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Core Enterprise</text>
    </g>

    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="70" height="32" rx="16" fill="#042f2e" stroke="#0d9488"/>
      <text x="14" y="21" fill="#5eead4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">C#</text>

      <rect x="80" y="0" width="100" height="32" rx="16" fill="#042f2e" stroke="#0d9488"/>
      <text x="92" y="21" fill="#5eead4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">.NET Core</text>

      <rect x="190" y="0" width="85" height="32" rx="16" fill="#042f2e" stroke="#0d9488"/>
      <text x="202" y="21" fill="#5eead4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Vue.js</text>

      <rect x="285" y="0" width="85" height="32" rx="16" fill="#042f2e" stroke="#0d9488"/>
      <text x="297" y="21" fill="#5eead4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Node.js</text>

      <rect x="380" y="0" width="115" height="32" rx="16" fill="#042f2e" stroke="#0d9488"/>
      <text x="392" y="21" fill="#5eead4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Healthcare ERP</text>
    </g>
  </g>

  <!-- Right: DICOM Radiology & ERP Console Mockup -->
  <g transform="translate(620, 90)">
    <rect width="520" height="570" rx="20" fill="#03161c" stroke="#115e59" stroke-width="2"/>
    <rect width="520" height="46" rx="20" fill="#042f2e"/>
    <circle cx="28" cy="23" r="6" fill="#ef4444"/>
    <circle cx="48" cy="23" r="6" fill="#eab308"/>
    <circle cx="68" cy="23" r="6" fill="#22c55e"/>
    <text x="100" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Labmate 8001 • DICOM Radiography Workstation</text>

    <!-- Radiography / DICOM screen pane -->
    <g transform="translate(24, 65)">
      <rect width="320" height="300" rx="14" fill="#000000" stroke="#0f766e"/>
      <!-- Simulated Chest Radiograph / CT slice -->
      <ellipse cx="160" cy="150" rx="110" ry="120" fill="#134e4a" opacity="0.3"/>
      <path d="M 160 50 L 160 250" stroke="#0891b2" stroke-dasharray="4,4" stroke-width="1"/>
      <path d="M 60 150 L 260 150" stroke="#0891b2" stroke-dasharray="4,4" stroke-width="1"/>
      
      <!-- Ribs / Anatomical contour lines -->
      <path d="M 120 90 Q 70 120 80 170" stroke="#5eead4" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M 200 90 Q 250 120 240 170" stroke="#5eead4" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M 130 110 Q 90 140 100 190" stroke="#5eead4" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M 190 110 Q 230 140 220 190" stroke="#5eead4" stroke-width="2" fill="none" opacity="0.6"/>

      <!-- Crosshair measurement badge -->
      <circle cx="160" cy="150" r="28" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
      <text x="12" y="25" fill="#22d3ee" font-family="monospace" font-size="11">DICOM 512x512</text>
      <text x="12" y="42" fill="#94a3b8" font-family="monospace" font-size="10">WW: 400 WL: 40</text>
      <text x="12" y="285" fill="#f59e0b" font-family="monospace" font-size="11">ROI: 3.24 cm²</text>
      <text x="210" y="285" fill="#10b981" font-family="monospace" font-size="11">ZOOM: 140%</text>
    </g>

    <!-- Side Tools Panel -->
    <g transform="translate(360, 65)">
      <rect width="134" height="300" rx="14" fill="#042f2e" stroke="#115e59"/>
      <text x="15" y="30" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TOOLS</text>
      
      <rect x="12" y="45" width="110" height="34" rx="8" fill="#065f46"/>
      <text x="22" y="67" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">🔍 Contrast</text>

      <rect x="12" y="90" width="110" height="34" rx="8" fill="#0f172a" stroke="#134e4a"/>
      <text x="22" y="112" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">📐 Caliper</text>

      <rect x="12" y="135" width="110" height="34" rx="8" fill="#0f172a" stroke="#134e4a"/>
      <text x="22" y="157" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">🔄 Invert LUT</text>

      <rect x="12" y="180" width="110" height="34" rx="8" fill="#0f172a" stroke="#134e4a"/>
      <text x="22" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">🏷 Annotate</text>

      <rect x="12" y="240" width="110" height="38" rx="8" fill="#0891b2"/>
      <text x="24" y="264" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Export PDF</text>
    </g>

    <!-- Bottom ERP Inventory & Patient Workflow -->
    <g transform="translate(24, 385)">
      <rect width="470" height="160" rx="14" fill="#042f2e" stroke="#115e59"/>
      <text x="20" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Laboratory Specimen &amp; Inventory Pipeline</text>

      <line x1="20" y1="42" x2="450" y2="42" stroke="#115e59"/>
      <text x="25" y="66" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">CBC Reagent Lot #R881</text>
      <text x="230" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">140 kits remaining</text>
      <text x="390" y="66" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">In Stock</text>

      <line x1="20" y1="84" x2="450" y2="84" stroke="#115e59"/>
      <text x="25" y="108" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Biochemistry Analyzer Mindray</text>
      <text x="230" y="108" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Online (RS-232 link)</text>
      <text x="390" y="108" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Synced</text>

      <line x1="20" y1="126" x2="450" y2="126" stroke="#115e59"/>
      <text x="25" y="148" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Direct Patient Portal Dispatch</text>
      <text x="230" y="148" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">SMS / Email Notification</text>
      <text x="390" y="148" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Automated</text>
    </g>
  </g>
</svg>
