<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/>
  </g>

  <!-- Glowing Aura Orbs -->
  <circle cx="280" cy="380" r="180" fill="#f59e0b" opacity="0.18" filter="url(#glow)"/>
  <circle cx="850" cy="350" r="220" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Left: Branding & Feature Badges -->
  <g transform="translate(80, 100)">
    <!-- Brand Badge -->
    <rect width="180" height="38" rx="19" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
    <circle cx="22" cy="19" r="6" fill="#f59e0b"/>
    <text x="38" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">FLAGSHIP PLATFORM</text>

    <!-- Title -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">Karto Delivery</text>
    <text x="0" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="500">Hyperlocal Multi-Role On-Demand Delivery System</text>

    <!-- Stat Pills -->
    <g transform="translate(0, 170)">
      <rect width="140" height="70" rx="16" fill="url(#cardGrad)" stroke="#334155"/>
      <text x="20" y="34" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="24" font-weight="800">4 Roles</text>
      <text x="20" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Cust • Vendor • Rider • Admin</text>
    </g>

    <g transform="translate(160, 170)">
      <rect width="140" height="70" rx="16" fill="url(#cardGrad)" stroke="#334155"/>
      <text x="20" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="800">&lt;150ms</text>
      <text x="20" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Socket.io GPS Stream</text>
    </g>

    <g transform="translate(320, 170)">
      <rect width="140" height="70" rx="16" fill="url(#cardGrad)" stroke="#334155"/>
      <text x="20" y="34" fill="#10b981" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Live</text>
      <text x="20" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Google Play Store</text>
    </g>

    <!-- Architecture Badges -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="105" height="32" rx="16" fill="#1e293b" stroke="#475569"/>
      <text x="14" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">React Native</text>

      <rect x="115" y="0" width="85" height="32" rx="16" fill="#1e293b" stroke="#475569"/>
      <text x="127" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Node.js</text>

      <rect x="210" y="0" width="100" height="32" rx="16" fill="#1e293b" stroke="#475569"/>
      <text x="222" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">PostgreSQL</text>

      <rect x="320" y="0" width="80" height="32" rx="16" fill="#1e293b" stroke="#475569"/>
      <text x="332" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Prisma</text>

      <rect x="410" y="0" width="95" height="32" rx="16" fill="#1e293b" stroke="#475569"/>
      <text x="422" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Razorpay</text>
    </g>
  </g>

  <!-- Right: Phone Mockup Simulation (Isometric / Frontal 3D Angle) -->
  <g transform="translate(680, 75)">
    <!-- Outer Phone Shadow -->
    <rect x="30" y="30" width="370" height="580" rx="48" fill="#000000" opacity="0.6" filter="url(#glow)"/>

    <!-- Phone Frame -->
    <rect x="30" y="10" width="370" height="600" rx="44" fill="#0b0f19" stroke="#334155" stroke-width="4"/>
    <rect x="38" y="18" width="354" height="584" rx="38" fill="#030712"/>

    <!-- Dynamic Island / Speaker -->
    <rect x="145" y="28" width="140" height="26" rx="13" fill="#000000"/>
    <circle cx="260" cy="41" r="5" fill="#1e293b"/>

    <!-- Phone Screen Content -->
    <!-- Top Bar -->
    <text x="65" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Delivering To</text>
    <text x="65" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Shahjahanpur, UP • Home ▾</text>
    <circle cx="345" cy="90" r="18" fill="#1e293b"/>
    <text x="339" y="96" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16">🔔</text>

    <!-- Simulated Map Card with Live Rider -->
    <g transform="translate(58, 125)">
      <rect width="314" height="170" rx="20" fill="#0f172a" stroke="#1e293b"/>
      <!-- Map Roads / Grid -->
      <path d="M 20 50 Q 120 70 200 40 T 300 80" stroke="#334155" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M 50 140 Q 150 110 220 150 T 300 130" stroke="#1e293b" stroke-width="4" fill="none"/>
      <!-- Route line -->
      <path d="M 40 120 L 130 90 L 190 60 L 270 45" stroke="#f59e0b" stroke-width="5" stroke-dasharray="6,4" fill="none"/>
      <!-- Destination pin -->
      <circle cx="270" cy="45" r="10" fill="#ef4444"/>
      <circle cx="270" cy="45" r="4" fill="#ffffff"/>
      <!-- Rider marker with pulse -->
      <circle cx="130" cy="90" r="16" fill="#f59e0b" fill-opacity="0.3"/>
      <circle cx="130" cy="90" r="9" fill="#f59e0b"/>
      <!-- ETA Floating Badge -->
      <rect x="75" y="125" width="165" height="32" rx="16" fill="#020617" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="92" y="146" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🛵 Rider arriving in 12 min</text>
    </g>

    <!-- Active Order Card -->
    <g transform="translate(58, 310)">
      <rect width="314" height="135" rx="20" fill="url(#cardGrad)" stroke="#334155"/>
      <text x="20" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Fresh Supermarket Order</text>
      <text x="20" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Order #KR-88219 • 5 Items</text>
      
      <!-- Progress Bar -->
      <rect x="20" y="70" width="274" height="6" rx="3" fill="#334155"/>
      <rect x="20" y="70" width="200" height="6" rx="3" fill="url(#primaryGrad)"/>

      <circle cx="20" cy="73" r="5" fill="#f59e0b"/>
      <circle cx="110" cy="73" r="5" fill="#f59e0b"/>
      <circle cx="220" cy="73" r="5" fill="#f59e0b"/>
      <circle cx="294" cy="73" r="5" fill="#475569"/>

      <text x="20" y="98" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Out For Delivery</text>
      <text x="220" y="98" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">₹429 Paid</text>

      <rect x="20" y="105" width="274" height="18" rx="9" fill="#020617" opacity="0.6"/>
      <text x="32" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Rider: Rajesh K. • Verified OTP Protected</text>
    </g>

    <!-- Bottom Categories / Nav -->
    <g transform="translate(58, 460)">
      <rect width="68" height="68" rx="18" fill="#1e293b" stroke="#334155"/>
      <text x="22" y="38" font-size="22">🍔</text>
      <text x="18" y="56" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Food</text>

      <rect x="82" y="0" width="68" height="68" rx="18" fill="#1e293b" stroke="#334155"/>
      <text x="104" y="38" font-size="22">🥦</text>
      <text x="96" y="56" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Grocery</text>

      <rect x="164" y="0" width="68" height="68" rx="18" fill="#1e293b" stroke="#334155"/>
      <text x="186" y="38" font-size="22">💊</text>
      <text x="178" y="56" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Pharma</text>

      <rect x="246" y="0" width="68" height="68" rx="18" fill="#1e293b" stroke="#334155"/>
      <text x="268" y="38" font-size="22">📦</text>
      <text x="260" y="56" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Parcel</text>
    </g>

    <!-- Bottom Dock Indicator -->
    <rect x="135" y="582" width="160" height="5" rx="2.5" fill="#64748b"/>
  </g>
</svg>
