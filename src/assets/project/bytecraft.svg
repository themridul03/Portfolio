<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad5)"/>
  <circle cx="280" cy="220" r="220" fill="#f59e0b" opacity="0.14" filter="url(#glow5)"/>
  <circle cx="950" cy="500" r="250" fill="#3b82f6" opacity="0.12" filter="url(#glow5)"/>

  <!-- Left: Info -->
  <g transform="translate(80, 100)">
    <rect width="210" height="38" rx="19" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5"/>
    <circle cx="22" cy="19" r="6" fill="#f59e0b"/>
    <text x="38" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">DEV TOOL &amp; COMPILER</text>

    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">ByteCraft</text>
    <text x="0" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="19" font-weight="500">Online HTML, CSS, JavaScript Compiler &amp; Playground</text>

    <g transform="translate(0, 175)">
      <rect width="150" height="75" rx="16" fill="#1e2330" stroke="#334155"/>
      <text x="20" y="36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Instant</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Hot Live Execution</text>
    </g>

    <g transform="translate(170, 175)">
      <rect width="150" height="75" rx="16" fill="#1e2330" stroke="#334155"/>
      <text x="20" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Sandboxed</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">IFrame Isolation</text>
    </g>

    <g transform="translate(340, 175)">
      <rect width="150" height="75" rx="16" fill="#1e2330" stroke="#334155"/>
      <text x="20" y="36" fill="#34d399" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Console</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Integrated Logs</text>
    </g>

    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="105" height="32" rx="16" fill="#1e293b" stroke="#475569"/>
      <text x="14" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">JavaScript</text>

      <rect x="115" y="0" width="85" height="32" rx="16" fill="#1e293b" stroke="#475569"/>
      <text x="127" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">HTML5</text>

      <rect x="210" y="0" width="85" height="32" rx="16" fill="#1e293b" stroke="#475569"/>
      <text x="222" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">CSS3</text>

      <rect x="305" y="0" width="105" height="32" rx="16" fill="#1e293b" stroke="#475569"/>
      <text x="318" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Live Editor</text>
    </g>
  </g>

  <!-- Right: Code Editor Mockup -->
  <g transform="translate(620, 90)">
    <rect width="520" height="570" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <rect width="520" height="46" rx="20" fill="#161b22"/>
    <circle cx="28" cy="23" r="6" fill="#ef4444"/>
    <circle cx="48" cy="23" r="6" fill="#eab308"/>
    <circle cx="68" cy="23" r="6" fill="#22c55e"/>
    <text x="100" y="28" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ByteCraft IDE • index.html &amp; script.js</text>

    <!-- Code Editor Panes -->
    <g transform="translate(20, 60)">
      <!-- Editor Top Tab -->
      <rect width="480" height="230" rx="12" fill="#0d1117" stroke="#21262d"/>
      <rect width="480" height="34" rx="12" fill="#161b22"/>
      <text x="15" y="22" fill="#58a6ff" font-family="monospace" font-size="12">main.js ✕</text>
      <text x="95" y="22" fill="#8b949e" font-family="monospace" font-size="12">style.css</text>
      <text x="175" y="22" fill="#8b949e" font-family="monospace" font-size="12">index.html</text>

      <!-- Code lines -->
      <g transform="translate(15, 55)" font-family="Consolas, Monaco, monospace" font-size="12">
        <text y="0" fill="#ff7b72">const</text>
        <text x="45" y="0" fill="#79c0ff">canvas</text>
        <text x="95" y="0" fill="#c9d1d9">=</text>
        <text x="110" y="0" fill="#ffa657">document</text>
        <text x="165" y="0" fill="#c9d1d9">.getElementById(</text>
        <text x="270" y="0" fill="#a5d6ff">'canvas'</text>
        <text x="325" y="0" fill="#c9d1d9">);</text>

        <text y="24" fill="#ff7b72">const</text>
        <text x="45" y="24" fill="#79c0ff">ctx</text>
        <text x="75" y="24" fill="#c9d1d9">=</text>
        <text x="90" y="24" fill="#79c0ff">canvas</text>
        <text x="135" y="24" fill="#c9d1d9">.getContext(</text>
        <text x="215" y="24" fill="#a5d6ff">'2d'</text>
        <text x="245" y="24" fill="#c9d1d9">);</text>

        <text y="48" fill="#8b949e">// Render particles with velocity physics</text>

        <text y="72" fill="#d2a8ff">function</text>
        <text x="60" y="72" fill="#79c0ff">animate()</text>
        <text x="130" y="72" fill="#c9d1d9">{</text>
        <text x="20" y="96" fill="#79c0ff">requestAnimationFrame</text>
        <text x="175" y="96" fill="#c9d1d9">(animate);</text>
        <text x="20" y="120" fill="#79c0ff">ctx</text>
        <text x="45" y="120" fill="#c9d1d9">.clearRect(0, 0, width, height);</text>
        <text y="144" fill="#c9d1d9">}</text>
        <text y="164" fill="#79c0ff">animate()</text>
        <text x="65" y="164" fill="#c9d1d9">;</text>
      </g>
    </g>

    <!-- Live Preview Sandbox Pane -->
    <g transform="translate(20, 310)">
      <rect width="480" height="235" rx="12" fill="#010409" stroke="#30363d"/>
      <rect width="480" height="34" rx="12" fill="#161b22"/>
      <circle cx="20" cy="17" r="4" fill="#238636"/>
      <text x="32" y="21" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Live Preview Output</text>
      
      <!-- Interactive animation canvas preview -->
      <g transform="translate(240, 135)">
        <circle cx="0" cy="0" r="45" fill="#f59e0b" fill-opacity="0.2"/>
        <circle cx="0" cy="0" r="30" fill="#f59e0b" fill-opacity="0.4"/>
        <circle cx="0" cy="0" r="15" fill="#f59e0b"/>
        
        <circle cx="-60" cy="-30" r="8" fill="#38bdf8"/>
        <circle cx="70" cy="-40" r="10" fill="#ec4899"/>
        <circle cx="-50" cy="50" r="9" fill="#10b981"/>
        <circle cx="80" cy="40" r="6" fill="#a78bfa"/>

        <!-- Orbit rings -->
        <circle cx="0" cy="0" r="75" stroke="#30363d" stroke-dasharray="4,4" fill="none"/>
        <circle cx="0" cy="0" r="110" stroke="#21262d" stroke-dasharray="6,6" fill="none"/>
      </g>

      <rect x="20" y="180" width="130" height="26" rx="13" fill="#238636" fill-opacity="0.3" stroke="#2ea043"/>
      <text x="35" y="197" fill="#3fb950" font-family="monospace" font-size="11">FPS: 60.0 (smooth)</text>
    </g>
  </g>
</svg>
